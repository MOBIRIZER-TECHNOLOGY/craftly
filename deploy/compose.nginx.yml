# The live server and nginx in front of it, on one machine.
#
#   CERT_DIR=/etc/letsencrypt/live/live.example.org ALLOW_ORIGIN=https://editor.example.org \
#     docker compose -f deploy/compose.nginx.yml up -d --build
#
# CERT_DIR holds fullchain.pem and privkey.pem; renewing them is up to you (certbot on the host, then
# `docker compose -f deploy/compose.nginx.yml exec nginx nginx -s reload`). Caddy (deploy/compose.caddy.yml) does that itself.
# Only nginx is reachable from outside; the server is on the compose network alone, which makes TRUST_PROXY=1 safe.
# Tried on 2026-11-28 with a test certificate for localhost (`scripts/live-check.mjs`; docs/DEPLOY.md, section 2.4).

services:
  live:
    build:
      context: ..
      dockerfile: Dockerfile.server
    image: craftly-live
    restart: unless-stopped
    environment:
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:?set ALLOW_ORIGIN to the editor's origin}
      TRUST_PROXY: "1"
      ROOM_TTL_DAYS: ${ROOM_TTL_DAYS:-30}
      ROOM_CREATE_KEY: ${ROOM_CREATE_KEY:-}
      METRICS_KEY: ${METRICS_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
    volumes:
      - live-data:/data

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - live
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:?set CERT_DIR to the folder of fullchain.pem and privkey.pem}:/etc/nginx/certs:ro

volumes:
  live-data:

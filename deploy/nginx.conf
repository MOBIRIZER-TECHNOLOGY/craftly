# The live server behind nginx (docs/DEPLOY.md, section 2.4), as deploy/compose.nginx.yml runs it: the server is the
# compose service `live`, and the certificate is mounted at /etc/nginx/certs (fullchain.pem and privkey.pem, as certbot
# names them). On a machine without compose, put 127.0.0.1:8787 for live:8787 and certbot's paths for the certificate.
#
# What matters, and why: the WebSocket upgrade on /ws is passed on; bodies up to MAX_MEDIA_MB and a little more are let
# through and streamed, not written to nginx's disk first; and quiet connections are kept open past the server's ping
# every 30 s. X-Forwarded-For is replaced by the address nginx saw, which TRUST_PROXY=1 on the server reads.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 110m;   # MAX_MEDIA_MB (100 MiB by default) and a little more
    proxy_request_buffering off; # a clip streams through to the server
    proxy_buffering off;         # and back to the browser

    location / {
        proxy_pass http://live:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

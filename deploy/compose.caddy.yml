# The live server and Caddy in front of it, on one machine.
#
#   LIVE_DOMAIN=live.example.org ALLOW_ORIGIN=https://editor.example.org docker compose -f deploy/compose.caddy.yml up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443); the server is on the compose network alone, which is what makes
# TRUST_PROXY=1 safe (docs/DEPLOY.md, section 2.3). The other settings of section 2.3 go under `environment`.
# Tried on 2026-11-28 with LIVE_DOMAIN=localhost (`scripts/live-check.mjs`; docs/DEPLOY.md, section 2.4).

services:
  live:
    build:
      context: ..
      dockerfile: Dockerfile.server
    image: craftly-live
    restart: unless-stopped
    environment:
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:?set ALLOW_ORIGIN to the editor's origin}
      TRUST_PROXY: "1"
      ROOM_TTL_DAYS: ${ROOM_TTL_DAYS:-30}
      ROOM_CREATE_KEY: ${ROOM_CREATE_KEY:-}
      METRICS_KEY: ${METRICS_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
    volumes:
      - live-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - live
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      LIVE_DOMAIN: ${LIVE_DOMAIN:?set LIVE_DOMAIN to the server's public name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  live-data:
  caddy-data:
  caddy-config:

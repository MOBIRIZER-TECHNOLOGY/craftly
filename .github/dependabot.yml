version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fonts:
        patterns:
          - "@fontsource/*"
          - "@fontsource-variable/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
          - "fake-indexeddb"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # the base image of Dockerfile.server (node:22-alpine), for its security updates
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
